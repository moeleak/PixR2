name = "pixr2"
main = "src/index.js"
compatibility_date = "2026-06-15"

# R2/KV/Secret 推荐在 Cloudflare Dashboard 的 Worker 设置里绑定。
# 如果你要使用 Wrangler CLI 部署，也可以取消下面配置的注释并填入自己的资源。
#
# [vars]
# ENABLE_TELEGRAM_BOT = "false"
#
# [[r2_buckets]]
# binding = "BUCKET_R2"
# bucket_name = "your-r2-bucket"
#
# [[kv_namespaces]]
# binding = "SHARES_KV"
# id = "your-shares-kv-namespace-id"
#
# [[kv_namespaces]]
# binding = "INDEXES_KV"
# id = "your-indexes-kv-namespace-id"
